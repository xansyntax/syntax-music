name: Build Syntax Music (Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
distribution: 'temurin'

- name: Setup Gradle
uses: gradle/actions/setup-gradle@v4

- name: Bundle VLC 64-bit native libraries
shell: pwsh
run: |
$vlcUrl = "https://download.videolan.org/pub/videolan/vlc/3.0.21/win64/vlc-3.0.21-win64.zip"
Invoke-WebRequest -Uri $vlcUrl -OutFile vlc.zip
Expand-Archive -Path vlc.zip -DestinationPath vlc_tmp -Force
$vlcDir = Get-ChildItem -Path vlc_tmp -Directory | Select-Object -First 1
New-Item -ItemType Directory -Force -Path "desktop/appResources/windows" | Out-Null
Copy-Item "$($vlcDir.FullName)/libvlc.dll" "desktop/appResources/windows/"
Copy-Item "$($vlcDir.FullName)/libvlccore.dll" "desktop/appResources/windows/"
Copy-Item "$($vlcDir.FullName)/plugins" "desktop/appResources/windows/plugins" -Recurse

- name: Package Windows EXE and MSI
run: ./gradlew :desktop:packageExe :desktop:packageMsi --no-daemon

- name: Upload Windows Installers
uses: actions/upload-artifact@v4
with:
name: SyntaxMusic-Windows-x64
path: |
desktop/build/compose/binaries/main/exe/*.exe
desktop/build/compose/binaries/main/msi/*.msi
